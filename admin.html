<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise - Admin Portal</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="w-full max-w-md">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 text-3xl mb-4 border border-indigo-500/20 shadow-inner">
                🏨
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Hotel Inder Paradise</h1>
            <p class="text-xs text-indigo-300 mt-1 uppercase tracking-widest font-semibold">Secure Admin Portal</p>
        </div>

        <!-- Glassmorphism Card -->
        <div class="glass-box p-8 rounded-3xl shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-6 text-center">Admin Login</h2>

            <!-- Error Message Box -->
            <div id="error-msg" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs text-center font-medium"></div>

            <!-- Login Form -->
            <form id="admin-login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-indigo-200 mb-2">Admin Email</label>
                    <input type="email" id="admin-email" placeholder="admin@inderparadise.com" 
                        class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-indigo-200 mb-2">Password</label>
                    <input type="password" id="admin-password" placeholder="••••••••" 
                        class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" required>
                </div>

                <button type="submit" id="login-btn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                    <span>Login to Dashboard</span>
                    <span>🚀</span>
                </button>
            </form>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-xs text-slate-500 mt-6">&copy; 2026 Hotel Inder Paradise. All rights reserved.</p>
    </div>

    <!-- Firebase SDK & Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Apna Firebase Config yahan dalein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('admin-login-form');
        const errorBox = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            errorBox.classList.add('hidden');
            loginBtn.innerText = "Signing in...";

            try {
                // Firebase Authentication
                await signInWithEmailAndPassword(auth, email, password);
                
                // Login successful hone par seedhe dashboard par bhej denge
                window.location.href = "dashboard.html";
            } catch (error) {
                errorBox.innerText = `Login Failed: ${error.message}`;
                errorBox.classList.remove('hidden');
                loginBtn.innerText = "Login to Dashboard 🚀";
            }
        });
    </script>
</body>
</html>
