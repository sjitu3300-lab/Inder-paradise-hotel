<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise - Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Top Header Title as requested */
        .portal-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Big White Center Circle Container */
        .login-container {
            background: white;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        .login-container h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
            width: 85%;
            position: relative;
            border-radius: 6px;
            /* Glowing wrapper effect container */
            padding: 2px;
        }

        .input-group label {
            display: block;
            margin-bottom: 3px;
            color: #555;
            font-size: 12px;
            font-weight: bold;
        }

        /* Input field with fast light border on hover */
        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #fff;
        }

        /* Hover effect: fast light running around the input box */
        .input-group:hover input {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.8), inset 0 0 4px rgba(0, 123, 255, 0.3);
        }

        /* Login Button with Liquid Fill Effect from bottom to top */
        .login-btn {
            width: 85%;
            padding: 9px;
            background-color: transparent;
            color: #007bff;
            border: 2px solid #007bff;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.4s ease;
            margin-top: 5px;
        }

        /* Liquid fill pseudo element */
        .login-btn::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: #007bff;
            z-index: -1;
            transition: height 0.35s ease-in-out;
        }

        /* When mouse hovers, liquid fills from bottom to top */
        .login-btn:hover::before {
            height: 100%;
        }

        .login-btn:hover {
            color: white;
        }

        #errorMsg {
            color: red;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <!-- Inder Paradise title text above the circle -->
    <div class="portal-title">Inder Paradise Admin</div>

    <div class="login-container">
        <h2>Admin Login</h2>
        <div class="input-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" placeholder="admin@inderparadise.com">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button class="login-btn" id="loginBtn">Login</button>
        <p id="errorMsg"></p>
    </div>

    <!-- Firebase Authentication Script (Original Config & Version Intact) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDSk5NYb9Wm3fMnhrIsEvY1YmQKemXKB-Q",
          authDomain: "hotel-authentication-9724f.firebaseapp.com",
          projectId: "hotel-authentication-9724f",
          storageBucket: "hotel-authentication-9724f.firebasestorage.app",
          messagingSenderId: "35809047972",
          appId: "1:35809047972:web:72e58da986b020e07a7d31",
          measurementId: "G-TZKY0W3PYV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Login Button Click Event with Dashboard Redirection Logic
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login Successful! Welcome Admin.");
                    // Safely redirect to dashboard once created
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    document.getElementById("errorMsg").innerText = "Login Failed: " + error.message;
                });
        });
    </script>
</body>
</html>
