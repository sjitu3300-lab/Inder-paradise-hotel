<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise - Admin Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6ecf5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Top Header Title */
        .portal-title {
            font-size: 26px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Embossed Neumorphic Card */
        .login-card {
            background: #e6ecf5;
            width: 380px;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 14px 14px 25px #babecc, -14px -14px 25px #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Icon Circle inside Card */
        .icon-circle {
            width: 60px;
            height: 60px;
            background: #e6ecf5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 6px 6px 12px #babecc, -6px -6px 12px #ffffff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .login-card h2 {
            margin-bottom: 5px;
            color: #1e293b;
            font-size: 22px;
            text-align: center;
        }

        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-size: 12px;
            font-weight: bold;
        }

        /* Debossed Input Fields (Inside depressed look) */
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: #e6ecf5;
            box-shadow: inset 4px 4px 8px #babecc, inset -4px -4px 8px #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            color: #334155;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            box-shadow: inset 6px 6px 10px #babecc, inset -6px -6px 10px #ffffff;
        }

        /* Embossed Login Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 6px 6px 12px #babecc, -6px -6px 12px #ffffff;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #4338ca;
        }

        .login-btn:active {
            box-shadow: inset 4px 4px 8px #3730a3, inset -4px -4px 8px #6366f1;
        }

        #errorMsg {
            color: #e11d48;
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header Title -->
    <div class="portal-title">Inder Paradise Admin</div>

    <div class="login-card">
        <!-- Icon Circle -->
        <div class="icon-circle">🏨</div>
        
        <h2>Welcome Admin</h2>
        <p class="subtitle">Login to manage hotel dashboard</p>

        <div class="input-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" placeholder="admin@inderparadise.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="login-btn" id="loginBtn">Login</button>
        <p id="errorMsg"></p>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDSk5NYb9Wm3fMnhrIsEvY1YmQKemXKB-Q",
          authDomain: "hotel-authentication-9724f.firebaseapp.com",
          projectId: "hotel-authentication-9724f",
          storageBucket: "hotel-authentication-9724f.firebasestorage.app",
          messagingSenderId: "35809047972",
          appId: "1:35809047972:web:72e58da986b020e07a7d31",
          measurementId: "G-TZKY0W3PYV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Login Button Click Event & Redirection Logic
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login Successful! Welcome Admin.");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    document.getElementById("errorMsg").innerText = "Login Failed: " + error.message;
                });
        });
    </script>
</body>
</html>
