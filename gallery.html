<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery | Hotel Inder Paradise Nagaur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { 
      --primary: #e63946;
      --primary-hover: #ff4757;
      --primary-glow: rgba(230, 57, 70, 0.35);
      --gold: #f5a623;
      --gold-light: #ffc048;
      --dark-bg: #09090b;
      --card-bg: #141418;
      --border-color: #24242c;
      --text: #f8f9fa;
      --text-muted: #9e9ea7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background: var(--dark-bg); color: var(--text); line-height: 1.7; }
    header { background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(12px); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--border-color); }
    .logo { font-family: Georgia, serif; font-size: 1.5rem; color: var(--gold); text-decoration: none; font-weight: bold; }
    .btn-home { background: linear-gradient(135deg, var(--primary) 0%, #d63031 100%); color: #fff; padding: 7px 15px; text-decoration: none; font-size: 0.8rem; font-weight: 700; border-radius: 8px; box-shadow: 0 4px 15px var(--primary-glow); transition: 0.3s; }
    .btn-home:hover { background: linear-gradient(135deg, var(--primary-hover) 0%, #c0392b 100%); transform: translateY(-2px); }
    .container { max-width: 1100px; margin: 50px auto; background: var(--card-bg); padding: 45px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    h1 { font-family: Georgia, serif; color: #fff; font-size: 2.3rem; margin-bottom: 20px; text-align: center; }
    p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 35px; font-size: 0.95rem; }
    .full-gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .gal-card { height: 260px; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
    .gal-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .gal-card:hover img { transform: scale(1.06); }
    footer { background: #060608; color: var(--text-muted); text-align: center; padding: 30px; margin-top: 60px; font-size: 0.85rem; border-top: 1px solid var(--border-color); }
    @media(max-width: 768px) { .full-gallery-grid { grid-template-columns: 1fr; } .container { padding: 20px; margin: 20px; } }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">INDER PARADISE</a>
    <a href="index.html" class="btn-home" target="_blank"><i class="fa-solid fa-house"></i> Home Page</a>
  </header>

  <div class="container">
    <h1>Hotel Photo Gallery</h1>
    <p class="subtitle">Explore a visual preview of Hotel Inder Paradise, Nagaur – Rooms, Restaurant, and Banquet spaces.</p>

    <div class="full-gallery-grid">
      <div class="gal-card"><img src="hotel-exterior.jpg" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=600&auto=format&fit=crop'" alt="Exterior"></div>
      <div class="gal-card"><img src="suite-room.jpg" onerror="this.src='https://images.unsplash.com/photo-1590490360182-c33d57733427?q=80&w=600&auto=format&fit=crop'" alt="Suite"></div>
      <div class="gal-card"><img src="deluxe-room.jpg" onerror="this.src='https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=600&auto=format&fit=crop'" alt="Deluxe Room"></div>
      <div class="gal-card"><img src="restaurant.jpg" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=600&auto=format&fit=crop'" alt="Restaurant"></div>
      <div class="gal-card"><img src="banquet-hall.jpg" onerror="this.src='https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=600&auto=format&fit=crop'" alt="Banquet"></div>
      <div class="gal-card"><img src="hotel-logo.jpg" onerror="this.src='https://images.unsplash.com/photo-1582719508461-905c673771fd?q=80&w=600&auto=format&fit=crop'" alt="Lobby"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Hotel Inder Paradise, Didwana Road, Nagaur, Rajasthan. All Rights Reserved.</p>
  </footer>
</body>
</html>
