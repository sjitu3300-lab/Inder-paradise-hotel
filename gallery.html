<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery | Hotel Inder Paradise Nagaur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { 
      --primary: #e63946;
      --primary-hover: #ff4757;
      --primary-glow: rgba(230, 57, 70, 0.35);
      --gold: #f5a623;
      --gold-light: #ffc048;
      --dark-bg: #09090b;
      --card-bg: #141418;
      --border-color: #24242c;
      --text: #f8f9fa;
      --text-muted: #9e9ea7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background: var(--dark-bg); color: var(--text); line-height: 1.7; }
    header { background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(12px); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--border-color); }
    .logo { font-family: Georgia, serif; font-size: 1.5rem; color: var(--gold); text-decoration: none; font-weight: bold; }
    .btn-home { background: linear-gradient(135deg, var(--primary) 0%, #d63031 100%); color: #fff; padding: 7px 15px; text-decoration: none; font-size: 0.8rem; font-weight: 700; border-radius: 8px; box-shadow: 0 4px 15px var(--primary-glow); transition: 0.3s; }
    .container { max-width: 1100px; margin: 40px auto; background: var(--card-bg); padding: 40px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    h1 { font-family: Georgia, serif; color: #fff; font-size: 2.3rem; margin-bottom: 10px; text-align: center; }
    p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
    
    /* Add Image Section */
    .add-img-box { background: #111116; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .add-img-box input { background: #09090b; border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 6px; color: #fff; font-size: 0.9rem; flex: 1; min-width: 220px; outline: none; }
    .add-img-box input:focus { border-color: var(--gold); }
    .btn-add { background: var(--gold); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-add:hover { background: var(--gold-light); }

    .full-gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .gal-card { height: 260px; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
    .gal-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .gal-card:hover img { transform: scale(1.06); }
    .gal-title { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(9, 9, 11, 0.85); color: #fff; font-size: 0.85rem; padding: 8px 12px; text-align: center; border-top: 1px solid var(--border-color); }
    
    footer { background: #060608; color: var(--text-muted); text-align: center; padding: 30px; margin-top: 60px; font-size: 0.85rem; border-top: 1px solid var(--border-color); }
    @media(max-width: 768px) { .full-gallery-grid { grid-template-columns: 1fr; } .container { padding: 20px; margin: 20px; } }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">INDER PARADISE</a>
    <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Home Page</a>
  </header>

  <div class="container">
    <h1>Hotel Photo Gallery</h1>
    <p class="subtitle">Explore a visual preview of Hotel Inder Paradise, Nagaur.</p>

    <!-- Add Image Form for Future Client -->
    <div class="add-img-box">
      <input type="text" id="imgUrlInput" placeholder="Image URL (e.g., https://...)">
      <input type="text" id="imgTitleInput" placeholder="Image Title (e.g., Deluxe Room)">
      <button class="btn-add" onclick="addNewImage()">+ Add Photo</button>
    </div>

    <div class="full-gallery-grid" id="galleryGrid"></div>
  </div>

  <footer>
    <p>© 2026 Hotel Inder Paradise, Didwana Road, Nagaur, Rajasthan. All Rights Reserved.</p>
  </footer>

  <script>
    const defaultImages = [
      { url: "hotel-exterior.jpg", title: "Hotel Exterior" },
      { url: "suite-room.jpg", title: "Super Deluxe Suite" },
      { url: "deluxe-room.jpg", title: "Deluxe AC Room" },
      { url: "restaurant.jpg", title: "Ashray Restaurant" },
      { url: "banquet-hall.jpg", title: "Banquet Hall" },
      { url: "hotel-logo.jpg", title: "Hotel Lobby" }
    ];

    function loadGallery() {
      let savedImages = JSON.parse(localStorage.getItem('hotelGalleryImages')) || defaultImages;
      const grid = document.getElementById('galleryGrid');
      
      grid.innerHTML = savedImages.map(img => `
        <div class="gal-card">
          <img src="${img.url}" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=600&auto=format&fit=crop'" alt="${img.title}">
          <div class="gal-title">${img.title}</div>
        </div>
      `).join('');
    }

    function addNewImage() {
      const url = document.getElementById('imgUrlInput').value.trim();
      const title = document.getElementById('imgTitleInput').value.trim();

      if (!url || !title) {
        alert("Kripya image URL aur title dono darj karein!");
        return;
      }

      let savedImages = JSON.parse(localStorage.getItem('hotelGalleryImages')) || defaultImages;
      savedImages.unshift({ url, title });
      localStorage.setItem('hotelGalleryImages', JSON.stringify(savedImages));

      document.getElementById('imgUrlInput').value = '';
      document.getElementById('imgTitleInput').value = '';
      loadGallery();
    }

    window.onload = loadGallery;
  </script>
</body>
</html>
