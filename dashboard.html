<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise - Premium Admin Dashboard</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar 🏨 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏨</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Hotel Inder Paradise</h1>
                    <p class="text-xs text-slate-400">Admin Management Portal</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="admin-email" class="text-sm bg-slate-800 px-3 py-1.5 rounded-full text-amber-400 font-medium"></span>
                <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Logout 🚪</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area 📊 -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Left Sidebar: Room Statistics & Offline Booking 📝 -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">📊 <span>Room Statistics</span></h2>
                <div class="space-y-3">
                    <div class="flex justify-between items-center bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                        <span class="text-sm font-medium text-emerald-700">Available Rooms</span>
                        <span id="count-available" class="font-bold text-emerald-800 text-lg">24</span>
                    </div>
                    <div class="flex justify-between items-center bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <span class="text-sm font-medium text-rose-700">Booked Rooms</span>
                        <span id="count-booked" class="font-bold text-rose-800 text-lg">0</span>
                    </div>
                </div>
            </div>

            <!-- Offline Booking Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">📝 <span>Offline Booking</span></h2>
                <form id="offline-booking-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Select Room</label>
                        <select id="book-room-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                            <option value="">-- Choose Room --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Guest Name</label>
                        <input type="text" id="guest-name" placeholder="Enter guest name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Booking Type</label>
                        <select id="booking-mode" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none">
                            <option value="Offline">Offline / Walk-in</option>
                            <option value="Online">Online Accepted</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-100">Confirm Booking 🚀</button>
                </form>
            </div>
        </div>

        <!-- Right Section: 24 Rooms Grid View with Bed Icon 🛏️ -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center">🚪 <span>All 24 Rooms Live Status</span></h2>
                    <span class="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full font-medium">Room Rent + GST 🧾</span>
                </div>

                <!-- Room Grid Container -->
                <div id="rooms-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                    <!-- Dynamic Rooms will load here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Note -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Hotel Inder Paradise Management Dashboard &copy; 2026. Room Rent + GST applicable.
    </footer>

    <!-- Firebase SDK (v12.19.0) & Dashboard Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDSk5NYb9Wm3fMnhrIsEvY1YmQKemXKB-Q",
          authDomain: "hotel-authentication-9724f.firebaseapp.com",
          projectId: "hotel-authentication-9724f",
          storageBucket: "hotel-authentication-9724f.firebasestorage.app",
          messagingSenderId: "35809047972",
          appId: "1:35809047972:web:72e58da986b020e07a7d31",
          measurementId: "G-TZKY0W3PYV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check Admin Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('admin-email').innerText = user.email;
                initRoomsDatabase();
            } else {
                window.location.href = "admin.html";
            }
        });

        // Logout Action
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "admin.html"; });
        });

        // 24 Rooms Master Data Structure with Categories & Rates
        const masterRooms = [
            // Deluxe (8 Rooms: 101 - 108)
            { id: "101", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "102", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "103", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "104", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "105", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "106", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "107", category: "Deluxe Room", single: 2400, double: 3000 },
            { id: "108", category: "Deluxe Room", single: 2400, double: 3000 },

            // Super Deluxe (11 Rooms: 201 - 211)
            { id: "201", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "202", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "203", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "204", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "205", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "206", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "207", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "208", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "209", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "210", category: "Super Deluxe", single: 2700, double: 3300 },
            { id: "211", category: "Super Deluxe", single: 2700, double: 3300 },

            // Triple Executive (1 Room: 301)
            { id: "301", category: "Triple Executive", single: 3000, double: 3500, triple: 4000 },

            // Suite Gold (2 Rooms: 401 - 402)
            { id: "401", category: "Suite Gold", single: 4200, double: 5200 },
            { id: "402", category: "Suite Gold", single: 4200, double: 5200 },

            // Suite Platinum (2 Rooms: 501 - 502)
            { id: "501", category: "Suite Platinum", single: 4500, double: 5500 },
            { id: "502", category: "Suite Platinum", single: 4500, double: 5500 }
        ];

        async function initRoomsDatabase() {
            const querySnapshot = await getDocs(collection(db, "rooms"));
            if (querySnapshot.empty) {
                for (let room of masterRooms) {
                    await setDoc(doc(db, "rooms", room.id), {
                        ...room,
                        status: "Available",
                        guest: "",
                        type: "None"
                    });
                }
            }
            loadDashboardData();
        }

        async function loadDashboardData() {
            const grid = document.getElementById('rooms-grid');
            const selectDropdown = document.getElementById('book-room-select');
            grid.innerHTML = "";
            selectDropdown.innerHTML = '<option value="">-- Choose Room --</option>';

            const querySnapshot = await getDocs(collection(db, "rooms"));
            let availableCount = 0;
            let bookedCount = 0;

            querySnapshot.forEach((docSnap) => {
                const room = docSnap.data();
                const isBooked = room.status === "Booked";

                if (isBooked) bookedCount++;
                else availableCount++;

                // Dropdown me sirf available rooms add honge sath me category dikhegi
                if (!isBooked) {
                    selectDropdown.innerHTML += `<option value="${room.id}">Room #${room.id} - ${room.category}</option>`;
                }

                // Room Card with Bed Icon 🛏️ and Room Rent + GST text update
                grid.innerHTML += `
                    <div class="p-5 rounded-2xl border ${isBooked ? 'bg-rose-50/50 border-rose-200' : 'bg-white border-slate-200'} shadow-sm flex flex-col justify-between transition-all hover:shadow-md">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-xl shadow-inner">🛏️</span>
                                    <span class="font-bold text-base text-slate-800">Room #${room.id}</span>
                                </div>
                                <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${isBooked ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                                    ${room.status}
                                </span>
                            </div>
                            <p class="text-xs font-semibold text-indigo-600 mb-3 bg-indigo-50/50 px-2.5 py-1 rounded-md inline-block">${room.category}</p>
                            <div class="text-xs text-slate-600 space-y-1 mb-4">
                                <p>Single: ₹${room.single} <span class="text-[10px] text-slate-500 font-semibold">+ GST</span></p>
                                <p>Double: ₹${room.double} <span class="text-[10px] text-slate-500 font-semibold">+ GST</span></p>
                                ${room.triple ? `<p>Triple: ₹${room.triple} <span class="text-[10px] text-slate-500 font-semibold">+ GST</span></p>` : ''}
                            </div>
                            ${isBooked ? `<p class="text-xs text-rose-600 font-semibold mb-3 bg-rose-50 p-2 rounded-lg">👤 Guest: ${room.guest} (${room.type})</p>` : ''}
                        </div>
                        <div>
                            ${isBooked ? 
                                `<button onclick="freeRoom('${room.id}')" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 rounded-xl transition">Checkout / Free Room</button>` : 
                                `<span class="text-xs text-emerald-600 font-medium flex items-center justify-center bg-emerald-50 py-2 rounded-xl">Available</span>`
                            }
                        </div>
                    </div>
                `;
            });

            document.getElementById('count-available').innerText = availableCount;
            document.getElementById('count-booked').innerText = bookedCount;
        }

        document.getElementById('offline-booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = document.getElementById('book-room-select').value;
            const guestName = document.getElementById('guest-name').value;
            const bookingMode = document.getElementById('booking-mode').value;

            if (!roomId) return alert("Please select a room!");

            await updateDoc(doc(db, "rooms", roomId), {
                status: "Booked",
                guest: guestName,
                type: bookingMode
            });

            document.getElementById('offline-booking-form').reset();
            loadDashboardData();
            alert(`Room #${roomId} successfully booked for ${guestName}! 🎉`);
        });

        window.freeRoom = async function(roomId) {
            if(confirm(`Are you sure you want to checkout Room #${roomId}?`)) {
                await updateDoc(doc(db, "rooms", roomId), {
                    status: "Available",
                    guest: "",
                    type: "None"
                });
                loadDashboardData();
            }
        }
    </script>
</body>
</html>
