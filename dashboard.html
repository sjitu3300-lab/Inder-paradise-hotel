<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Inder Paradise - Premium Admin Dashboard</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏨</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Hotel Inder Paradise</h1>
                    <p class="text-xs text-slate-400">Admin Management Portal</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="admin-email" class="text-sm bg-slate-800 px-3 py-1.5 rounded-full text-amber-400 font-medium"></span>
                <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Logout 🚪</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Left Sidebar: Room Statistics & Offline Booking -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">📊 <span>Room Statistics</span></h2>
                <div class="space-y-3">
                    <div class="flex justify-between items-center bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                        <span class="text-sm font-medium text-emerald-700">Available Rooms</span>
                        <span id="count-available" class="font-bold text-emerald-800 text-lg">24</span>
                    </div>
                    <div class="flex justify-between items-center bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <span class="text-sm font-medium text-rose-700">Booked Rooms</span>
                        <span id="count-booked" class="font-bold text-rose-800 text-lg">0</span>
                    </div>
                </div>
            </div>

            <!-- Offline Booking Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">📝 <span>Quick Booking</span></h2>
                <form id="offline-booking-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Select Room</label>
                        <select id="book-room-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                            <option value="">-- Choose Room --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Guest Name</label>
                        <input type="text" id="guest-name" placeholder="Enter guest name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Booking Type</label>
                        <select id="booking-mode" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none">
                            <option value="Offline">Offline / Walk-in</option>
                            <option value="Online">Online Accepted</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-100">Confirm Booking 🚀</button>
                </form>
            </div>
        </div>

        <!-- Right Section: All 24 Rooms Grid View -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center">🚪 <span>All 24 Rooms Live Status</span></h2>
                    <span class="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full font-medium">Rates include GST + Breakfast 🍳</span>
                </div>

                <!-- Room Grid Container -->
                <div id="rooms-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                    <!-- Dynamic Rooms loaded here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Hotel Inder Paradise Management Dashboard &copy; 2026. Multiple Bookings Supported.
    </footer>

    <!-- Firebase SDK & Dashboard Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDSk5NYb9Wm3fMnhrIsEvY1YmQKemXKB-Q",
          authDomain: "hotel-authentication-9724f.firebaseapp.com",
          projectId: "hotel-authentication-9724f",
          storageBucket: "hotel-authentication-9724f.firebasestorage.app",
          messagingSenderId: "35809047972",
          appId: "1:35809047972:web:72e58da986b020e07a7d31",
          measurementId: "G-TZKY0W3PYV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let roomsDataMap = {};

        // Master setup for 24 rooms categories & rates
        const masterRoomsData = {};
        for (let i = 1; i <= 24; i++) {
            let roomNo = (100 + i).toString();
            let cat = i <= 8 ? "Deluxe Room" : (i <= 19 ? "Super Deluxe" : (i === 20 ? "Triple Executive" : (i <= 22 ? "Suite Gold" : "Suite Platinum")));
            let singleRate = cat === "Deluxe Room" ? 2400 : (cat === "Super Deluxe" ? 2700 : (cat === "Triple Executive" ? 3000 : (cat === "Suite Gold" ? 4200 : 4500)));
            let doubleRate = cat === "Deluxe Room" ? 3000 : (cat === "Super Deluxe" ? 3300 : (cat === "Triple Executive" ? 3500 : (cat === "Suite Gold" ? 5200 : 5500)));
            
            masterRoomsData[roomNo] = {
                id: roomNo,
                category: cat,
                single: singleRate,
                double: doubleRate,
                status: "Available",
                guest: "",
                type: "None"
            };
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('admin-email').innerText = user.email;
                initDashboardData();
            } else {
                window.location.href = "admin.html";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "admin.html"; });
        });

        function initDashboardData() {
            // Real-time snapshot listener ensuring multiple bookings merge safely
            onSnapshot(collection(db, "rooms"), (snapshot) => {
                snapshot.forEach(docSnap => {
                    roomsDataMap[docSnap.id] = { ...masterRoomsData[docSnap.id], ...docSnap.data() };
                });
                renderDashboard();
            });
        }

        function renderDashboard() {
            const grid = document.getElementById('rooms-grid');
            const selectDropdown = document.getElementById('book-room-select');
            if (!grid || !selectDropdown) return;

            grid.innerHTML = "";
            selectDropdown.innerHTML = '<option value="">-- Choose Room --</option>';

            let availableCount = 0;
            let bookedCount = 0;

            for (let i = 1; i <= 24; i++) {
                let roomNo = (100 + i).toString();
                let room = roomsDataMap[roomNo] || masterRoomsData[roomNo];
                let isBooked = room.status === "Booked" && room.guest && room.guest.trim() !== "";

                if (isBooked) {
                    bookedCount++;
                } else {
                    availableCount++;
                    selectDropdown.innerHTML += `<option value="${room.id}">Room ${room.id} (${room.category})</option>`;
                }

                grid.innerHTML += `
                    <div class="p-5 rounded-2xl border ${isBooked ? 'bg-rose-50/50 border-rose-200' : 'bg-white border-slate-200'} shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-lg text-slate-800">Room #${room.id}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${isBooked ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                                    ${isBooked ? 'Booked 🔴' : 'Available 🟢'}
                                </span>
                            </div>
                            <p class="text-xs font-medium text-indigo-600 mb-3">${room.category}</p>
                            <div class="text-xs text-slate-600 space-y-1 mb-4">
                                <p>Single: ₹${room.single} <span class="text-[10px] text-slate-400">(+GST)</span></p>
                                <p>Double: ₹${room.double} <span class="text-[10px] text-slate-400">(+GST)</span></p>
                            </div>
                            ${isBooked ? `<p class="text-xs text-rose-600 font-semibold mb-3">👤 Guest: ${room.guest} (${room.type || 'Offline'})</p>` : ''}
                        </div>
                        <div>
                            ${isBooked ? 
                                `<button onclick="freeRoom('${room.id}')" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 rounded-xl transition">Checkout / Free Room</button>` : 
                                `<span class="text-xs text-emerald-600 font-medium flex items-center justify-center bg-emerald-50 py-2 rounded-xl">Ready for Booking</span>`
                            }
                        </div>
                    </div>
                `;
            }

            document.getElementById('count-available').innerText = availableCount;
            document.getElementById('count-booked').innerText = bookedCount;
        }

        // Handle Quick Booking from Dashboard
        document.getElementById('offline-booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomId = document.getElementById('book-room-select').value;
            const guestName = document.getElementById('guest-name').value.trim();
            const bookingMode = document.getElementById('booking-mode').value;

            if (!roomId || !guestName) return alert("Please select a room and enter guest name!");

            let baseData = roomsDataMap[roomId] || masterRoomsData[roomId];
            let updatedData = {
                ...baseData,
                status: "Booked",
                guest: guestName,
                type: bookingMode
            };

            try {
                await setDoc(doc(db, "rooms", roomId), updatedData, { merge: true });
                roomsDataMap[roomId] = updatedData;
                document.getElementById('offline-booking-form').reset();
                renderDashboard();
                alert(`Room #${roomId} successfully booked for ${guestName}! 🎉`);
            } catch (err) {
                alert("Booking error: " + err.message);
            }
        });

        // Checkout / Free Room Function
        window.freeRoom = async function(roomId) {
            if(confirm(`Are you sure you want to checkout Room #${roomId}?`)) {
                let baseData = roomsDataMap[roomId] || masterRoomsData[roomId];
                let resetData = {
                    ...baseData,
                    status: "Available",
                    guest: "",
                    type: "None"
                };
                try {
                    await setDoc(doc(db, "rooms", roomId), resetData, { merge: true });
                    roomsDataMap[roomId] = resetData;
                    renderDashboard();
                } catch (err) {
                    alert("Checkout error: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
