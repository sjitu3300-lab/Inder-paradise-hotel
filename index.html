<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inder Paradise Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- हेडर सेक्शन -->
    <header>
        <div class="logo">INDER PARADISE</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#suites">Suites</a>
            <a href="#dining">Dining</a>
            <a href="#contact">Contact Us</a>
        </nav>
        <a href="#book" class="book-btn">BOOK NOW</a>
    </header>

    <!-- हीरो सेक्शन -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>EXPERIENCE TRUE PARADISE.</h1>
            <p>The Quintessence of Luxury Hospitality.</p>
        </div>
    </section>

    <!-- कमरों का सेक्शन -->
    <section id="suites" class="suites-section">
        <h2>OUR SIGNATURE SUITES</h2>
        <div class="suite-grid">
            <div class="suite-card">
                <h3>Premium Bedroom</h3>
                <p>आरामदायक और आधुनिक सुविधाओं से लैस सुइट।</p>
                <button class="detail-btn">View Details</button>
            </div>
            <div class="suite-card">
                <h3>Luxury Suite</h3>
                <p>स्वर्ग जैसा अनुभव और शानदार इंटीरियर।</p>
                <button class="detail-btn">View Details</button>
            </div>
        </div>
    </section>

</body>
              </html>
