<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inder Paradise | Luxury Hotel & Restaurant</title>
    <style>
        /* --- 1. लक्जरी बैकग्राउंड और ग्लोबल स्टाइल्स --- */
        :root {
            --bg-color: #0d0e12;
            --gold-color: #d4af37;
            --light-gold: #f3e5ab;
            --text-main: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- 2. नेविगेशन बार (हेडर) --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 5%;
            background: rgba(13, 14, 18, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 1000;
        }

        /* बाएं तरफ क्लिक करने योग्य मेनू बार */
        .menu-trigger {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 5px;
        }

        .menu-trigger span {
            display: block;
            width: 28px;
            height: 2px;
            background-color: var(--gold-color);
            transition: 0.3s;
        }

        .menu-trigger:hover span {
            background-color: var(--light-gold);
        }

        /* बीच में होटल का नाम (लोगो) */
        .logo-title {
            text-align: center;
            text-decoration: none;
        }

        .logo-title h1 {
            font-size: 20px;
            color: var(--text-main);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .logo-title span {
            font-size: 9px;
            color: var(--gold-color);
            letter-spacing: 4px;
            text-transform: uppercase;
            display: block;
        }

        /* दाएं तरफ क्लिक करने योग्य बुक नाउ बटन */
        .book-now-btn {
            background-color: var(--gold-color);
            color: var(--bg-color);
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-now-btn:hover {
            background-color: var(--light-gold);
        }

        /* --- 3. हीरो सेक्शन (होटल का नाम, पता और भव्य तस्वीर) --- */
        .hero-section {
            padding: 120px 5% 60px 5%;
            text-align: center;
            background: radial-gradient(circle at center, #1a1c26 0%, var(--bg-color) 100%);
        }

        .hotel-info h2 {
            font-size: 36px;
            color: var(--text-main);
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hotel-info p {
            font-size: 14px;
            color: var(--gold-color);
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: 'Segoe UI', sans-serif;
        }

        /* होटल की लक्जरी तस्वीर */
        .hero-image-container {
            width: 100%;
            max-width: 1000px;
            height: 450px;
            margin: 0 auto;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .hero-image-container img:hover {
            transform: scale(1.03);
        }

        /* मोबाइल रेस्पॉन्सिविटी */
        @media(max-width: 768px) {
            .hero-info h2 { font-size: 24px; }
            .hero-image-container { height: 280px; }
            header { padding: 15px 4%; }
        }
    </style>
</head>
<body>

    <!-- 2. हेडर: बाएं मेनू, बीच में नाम, दाएं बुक नाउ -->
    <header>
        <!-- क्लिक करने योग्य मेनू बटन -->
        <button class="menu-trigger" onclick="alert('Menu clicked!')" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- बीच में लोगो/नाम -->
        <a href="#" class="logo-title">
            <h1>Inder Paradise</h1>
            <span>Luxury Hotel & Restaurant</span>
        </a>

        <!-- क्लिक करने योग्य बुक नाउ बटन -->
        <button class="book-now-btn" onclick="alert('Book Now clicked!')">
            Book Now
        </button>
    </header>

    <!-- 3. हीरो सेक्शन: नाम, पता और भव्य तस्वीर -->
    <section class="hero-section">
        <div class="hotel-info">
            <h2>Hotel Inder Paradise</h2>
            <p>📍 Luxury Stay & Fine Dining Experience</p>
        </div>

        <!-- होटल की मुख्य लक्जरी तस्वीर (यहाँ अपनी इमेज फाइल का नाम जैसे 1000516065_2.jpg रख सकते हैं) -->
        <div class="hero-image-container">
            <img src="1000516059_2.jpg" alt="Inder Paradise Luxury Interior">
        </div>
    </section>

</body>
</html>
